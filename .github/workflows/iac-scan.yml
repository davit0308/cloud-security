name: IaC Scan

on:
  push:
    branches:
      - "generator/**"

jobs:
  checkov:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Files
        run: |
          pwd
          ls -la

      - name: Run Checkov
        run: |
          checkov -d .
