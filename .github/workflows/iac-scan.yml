name: IaC Security Scan Pipeline

on:
  push:
    branches:
      - 'generated/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch cần quét (để trống = branch hiện tại)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (true = chỉ quét, không remediate)'
        required: false
        default: 'false'
        type: choice
        options: ['false']

concurrency:
  group: scan-${{ github.ref }}
  cancel-in-progress: true

env:
  REPORTS_DIR: /home/scan/scanners/reports-ga
  ELK_IP:      "100.116.107.97"
  SCANNER_IP:  "100.112.127.63"
  OPENSTACK_IP: "100.113.72.113"

jobs:
  # ═══════════════════════════════════════════════════════════════
  # JOB 1 — Pre-deployment IaC Scan (Checkov + Trivy)
  #
  # actions/checkout@v4 tự động clone ĐÚNG branch đã trigger
  # workflow (GITHUB_REF_NAME). File .tf xuất hiện tại:
  #   ~/actions-runner/_work/<repo>/<repo>/
  # Checkov và Trivy đọc file từ đó qua docker volume mount.
  # ═══════════════════════════════════════════════════════════════
  pre-deployment-scan:
    name: Pre-deployment IaC Scan
    runs-on: self-hosted
    timeout-minutes: 30

    outputs:
      scan_passed:   ${{ steps.evaluate.outputs.scan_passed }}
      checkov_fails: ${{ steps.evaluate.outputs.checkov_fails }}
      trivy_fails:   ${{ steps.evaluate.outputs.trivy_fails }}
      branch_id:     ${{ steps.meta.outputs.branch_id }}
      fixed_branch:  ${{ steps.meta.outputs.fixed_branch }}

    steps:
      # ── 1. Checkout đúng branch đã trigger ──────────────────────
      - name: Checkout IaC code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      # ── 2. Trích xuất metadata từ tên nhánh ─────────────────────
      - name: Extract branch metadata
        id: meta
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}"
          BRANCH_ID="${BRANCH_NAME#generated/}"
          FIXED_BRANCH="fixed/${BRANCH_ID}"
          echo "branch_id=${BRANCH_ID}"       >> $GITHUB_OUTPUT
          echo "fixed_branch=${FIXED_BRANCH}" >> $GITHUB_OUTPUT
          echo "branch_name=${BRANCH_NAME}"   >> $GITHUB_OUTPUT
          echo "Scanning branch : ${BRANCH_NAME}"
          echo "Branch ID       : ${BRANCH_ID}"
          echo "GITHUB_WORKSPACE: ${GITHUB_WORKSPACE}"
          echo "Files in workspace:"
          ls -la "${GITHUB_WORKSPACE}/"

      # ── 3. Chuẩn bị thư mục reports ─────────────────────────────
      # Tạo trong mỗi job — không dựa vào trạng thái máy
      - name: Prepare report directories
        run: |
          mkdir -p ${{ env.REPORTS_DIR }}/checkov
          mkdir -p ${{ env.REPORTS_DIR }}/trivy
          rm -f ${{ env.REPORTS_DIR }}/checkov/*.json
          rm -f ${{ env.REPORTS_DIR }}/trivy/*.json
          echo "Report dirs ready:"
          ls -la ${{ env.REPORTS_DIR }}/

      # ── 4. Checkov scan ─────────────────────────────────────────
      - name: Run Checkov (IaC static analysis)
        id: checkov
        run: |
          echo "=== CHECKOV SCAN ==="
          echo "Terraform files found:"
          find "${GITHUB_WORKSPACE}" -name "*.tf" | head -20

          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/target" \
            -v "${{ env.REPORTS_DIR }}/checkov:/reports" \
            bridgecrew/checkov:latest \
            -d /target \
            --output json \
            --output-file-path /reports/ \
            --compact \
            --soft-fail || true

          echo "Checkov reports:"
          ls -la ${{ env.REPORTS_DIR }}/checkov/

      # ── 5. Trivy scan ────────────────────────────────────────────
      # FIX: mount REPORTS_DIR/trivy vào /reports trong container,
      # ghi output thẳng vào /reports để tránh permission issues
      - name: Run Trivy (IaC config scan)
        id: trivy
        run: |
          echo "=== TRIVY SCAN ==="

          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/target" \
            -v "${{ env.REPORTS_DIR }}/trivy:/reports" \
            aquasec/trivy:latest \
            config /target \
            --format json \
            --output /reports/iac-terraform.json \
            --exit-code 0 || true

          echo "Trivy reports:"
          ls -la ${{ env.REPORTS_DIR }}/trivy/

      # ── 6. Đánh giá kết quả scan ────────────────────────────────
      - name: Evaluate scan results
        id: evaluate
        run: |
          echo "=== ĐÁNH GIÁ KẾT QUẢ ==="

          CHECKOV_REPORT="${{ env.REPORTS_DIR }}/checkov/results_json.json"
          TRIVY_REPORT="${{ env.REPORTS_DIR }}/trivy/iac-terraform.json"
          CHECKOV_FAILS=0
          TRIVY_FAILS=0

          if [ -f "$CHECKOV_REPORT" ]; then
            CHECKOV_FAILS=$(python3 -c "
          import json, sys
          try:
              data = json.load(open('${CHECKOV_REPORT}'))
              failed = data.get('results', {}).get('failed_checks', [])
              print(len(failed))
          except Exception as e:
              sys.stderr.write(f'Parse error: {e}\n')
              print(0)
          " 2>/dev/null || echo 0)
          else
            echo "⚠️ Checkov report không tìm thấy: $CHECKOV_REPORT"
          fi

          if [ -f "$TRIVY_REPORT" ]; then
            TRIVY_FAILS=$(python3 -c "
          import json, sys
          try:
              data = json.load(open('${TRIVY_REPORT}'))
              total = 0
              for r in data.get('Results', []):
                  total += len(r.get('Misconfigurations', []) or [])
              print(total)
          except Exception as e:
              sys.stderr.write(f'Parse error: {e}\n')
              print(0)
          " 2>/dev/null || echo 0)
          else
            echo "⚠️ Trivy report không tìm thấy: $TRIVY_REPORT"
          fi

          TOTAL_FAILS=$((CHECKOV_FAILS + TRIVY_FAILS))
          echo "checkov_fails=${CHECKOV_FAILS}" >> $GITHUB_OUTPUT
          echo "trivy_fails=${TRIVY_FAILS}"     >> $GITHUB_OUTPUT

          if [ "$TOTAL_FAILS" -eq 0 ]; then
            echo "scan_passed=true" >> $GITHUB_OUTPUT
            echo "✅ Scan PASSED — không có lỗi nào"
          else
            echo "scan_passed=false" >> $GITHUB_OUTPUT
            echo "❌ Scan FAILED — Checkov: ${CHECKOV_FAILS}, Trivy: ${TRIVY_FAILS}"
          fi

      # ── 7. Normalizer → RabbitMQ → ELK ──────────────────────────
      - name: Normalize findings & push to ELK
        run: |
          echo "=== NORMALIZER ==="
          cd $HOME/scanners
          set -a; source .env; set +a
          export REPORTS_DIR="${{ env.REPORTS_DIR }}"
          export CLOUD_PROVIDER="${{ vars.CLOUD_PROVIDER || 'aws' }}"
          python3 -m normalizer.main pre_config
          echo "Normalizer hoàn thành"

      # ── 8. Slack notification ────────────────────────────────────
      - name: Notify Slack — scan result
        if: always()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          PASSED="${{ steps.evaluate.outputs.scan_passed }}"
          CHECKOV="${{ steps.evaluate.outputs.checkov_fails }}"
          TRIVY="${{ steps.evaluate.outputs.trivy_fails }}"
          BRANCH="${{ steps.meta.outputs.branch_id }}"
          if [ "$PASSED" = "true" ]; then ICON=":white_check_mark:"; STATUS="PASSED"
          else ICON=":x:"; STATUS="FAILED"; fi

          curl -s -X POST "$SLACK_WEBHOOK" \
            -H "Content-type: application/json" \
            -d "{
              \"blocks\": [{
                \"type\": \"header\",
                \"text\": {\"type\": \"plain_text\", \"text\": \"${ICON} Pre-deployment Scan ${STATUS}\"}
              },{
                \"type\": \"section\",
                \"fields\": [
                  {\"type\": \"mrkdwn\", \"text\": \"*Branch ID:*\n\`${BRANCH}\`\"},
                  {\"type\": \"mrkdwn\", \"text\": \"*Checkov lỗi:*\n${CHECKOV}\"},
                  {\"type\": \"mrkdwn\", \"text\": \"*Trivy lỗi:*\n${TRIVY}\"},
                  {\"type\": \"mrkdwn\", \"text\": \"*Run:*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Xem chi tiết>\"}
                ]
              }]
            }" || true

  # ═══════════════════════════════════════════════════════════════
  # JOB 2 — Triage & Remediation (chỉ khi scan fail)
  # ═══════════════════════════════════════════════════════════════
  triage-and-remediate:
    name: Triage & Remediation
    runs-on: self-hosted
    needs: pre-deployment-scan
    if: needs.pre-deployment-scan.outputs.scan_passed == 'false'
    timeout-minutes: 20

    outputs:
      fixed_branch: ${{ steps.create_fixed.outputs.fixed_branch }}
      has_fixes:    ${{ steps.create_fixed.outputs.has_fixes }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      # FIX: Tạo REPORTS_DIR trong job này
      - name: Prepare report directories
        run: |
          mkdir -p ${{ env.REPORTS_DIR }}/checkov
          mkdir -p ${{ env.REPORTS_DIR }}/trivy

      # ── Setup SSH key đến elk-vm ─────────────────────────────────
      - name: Setup SSH key for ELK VM
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.ELK_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519_elk
          chmod 600 ~/.ssh/id_ed25519_elk
          ssh-keyscan -H ${{ env.ELK_IP }} >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH key ready — target: ${{ env.ELK_IP }}"

      # ── Trigger Triage trên elk-vm qua SSH ──────────────────────
      # FIX: Truyền DRY_RUN từ workflow_dispatch input vào SSH session
      # Khi trigger bằng push (không có input) → mặc định true
      - name: Trigger Triage & Remediation on ELK VM
        id: triage
        timeout-minutes: 10
        env:
          ELK_USER: ${{ secrets.ELK_SSH_USER }}
        run: |
          DRY_RUN_VALUE="${{ github.event.inputs.dry_run || 'false' }}"
          BRANCH_ID_VALUE="${{ needs.pre-deployment-scan.outputs.branch_id }}"
          echo "=== KÍCH HOẠT TRIAGE TRÊN ELK VM (${{ env.ELK_IP }}) ==="
          echo "DRY_RUN mode: ${DRY_RUN_VALUE}"
          echo "Chờ 10 giây để Logstash đẩy dữ liệu vào Elasticsearch..."
          sleep 10

          ssh -i ~/.ssh/id_ed25519_elk \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=3 \
              "${ELK_USER}@${{ env.ELK_IP }}" \
              "cd ~/elk-stack/pipeline \
               && source .env \
               && export DRY_RUN=${DRY_RUN_VALUE} \
               && export BRANCH_ID=${BRANCH_ID_VALUE} \
               && timeout 300 python3 run_awsgoat_triage.py"

          echo "Triage hoàn thành"

      # ── Kiểm tra nhánh fixed/* do dispatcher đã push ───────────
      # Dispatcher (elk-vm) tự clone generated/*, áp dụng fix,
      # và push lên fixed/* trực tiếp qua pr_creator.py.
      # Job này chỉ cần kiểm tra xem nhánh đó có tồn tại không.
      - name: Check fixed branch created by dispatcher
        id: create_fixed
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          BRANCH_ID="${{ needs.pre-deployment-scan.outputs.branch_id }}"
          FIXED_BRANCH="fixed/${BRANCH_ID}"

          echo "=== KIỂM TRA NHÁNH ${FIXED_BRANCH} ==="

          git fetch origin 2>/dev/null || true

          # Kiểm tra xem dispatcher đã push fixed branch chưa
          if git ls-remote --exit-code --heads origin "${FIXED_BRANCH}" > /dev/null 2>&1; then
            echo "✅ Dispatcher đã tạo ${FIXED_BRANCH} — có fix thực sự"
            echo "has_fixes=true"  >> $GITHUB_OUTPUT

            # Kiểm tra nhánh có commit thực sự (không phải placeholder)
            COMMIT_MSG=$(git log "origin/${FIXED_BRANCH}" -1 --format="%s" 2>/dev/null || echo "")
            echo "Commit message: ${COMMIT_MSG}"
            if echo "$COMMIT_MSG" | grep -q "placeholder"; then
              echo "⚠️ Branch là placeholder — không có fix thực sự"
              echo "has_fixes=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "ℹ️ Dispatcher chưa tạo ${FIXED_BRANCH} — không có fix tự động"
            echo "has_fixes=false" >> $GITHUB_OUTPUT
          fi

          echo "fixed_branch=${FIXED_BRANCH}" >> $GITHUB_OUTPUT

  # ═══════════════════════════════════════════════════════════════
  # JOB 3 — Verify Fixes: Re-scan nhánh fixed/*
  # Chỉ chạy khi dispatcher thực sự tạo được file fix
  # ═══════════════════════════════════════════════════════════════
  verify-fixes:
    name: Verify Fixes (Re-scan)
    runs-on: self-hosted
    needs: triage-and-remediate
    if: needs.triage-and-remediate.outputs.has_fixes == 'true'
    timeout-minutes: 15

    outputs:
      rescan_passed: ${{ steps.rescan.outputs.scan_passed }}

    steps:
      # Checkout ĐÚNG nhánh fixed (không phải generated)
      - name: Checkout fixed branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.triage-and-remediate.outputs.fixed_branch }}
          token: ${{ secrets.GH_PAT }}

      - name: Prepare rescan report directory
        run: |
          # Lấy branch name, thay / thành - để dùng làm tên thư mục con
          # Ví dụ: fixed/test-001 → fixed-test-001
          BRANCH_SAFE="${{ needs.triage-and-remediate.outputs.fixed_branch }}"
          BRANCH_SAFE="${BRANCH_SAFE//\//-}"
          RESCAN_DIR="/tmp/rescan-${BRANCH_SAFE}"
          mkdir -p "${RESCAN_DIR}/checkov"
          echo "RESCAN_DIR=${RESCAN_DIR}" >> $GITHUB_ENV
          echo "Rescan dir: ${RESCAN_DIR}"

      - name: Re-run Checkov on fixed IaC
        id: rescan
        run: |
          echo "=== RE-SCAN NHÁNH FIXED ==="
          echo "Files trong workspace:"
          ls -la "${GITHUB_WORKSPACE}/"

          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/target" \
            -v "${{ env.RESCAN_DIR }}/checkov:/reports" \
            bridgecrew/checkov:latest \
            -d /target \
            --output json \
            --output-file-path /reports/ \
            --compact \
            --soft-fail || true

          CHECKOV_FAILS=$(python3 -c "
          import json
          try:
              data = json.load(open('${{ env.RESCAN_DIR }}/checkov/results_json.json'))
              print(len(data.get('results', {}).get('failed_checks', [])))
          except:
              print(0)
          " 2>/dev/null || echo 0)

          echo "Re-scan Checkov fails: ${CHECKOV_FAILS}"

          if [ "$CHECKOV_FAILS" -eq 0 ]; then
            echo "scan_passed=true"  >> $GITHUB_OUTPUT
            echo "✅ Re-scan PASSED — IaC đã clean"
          else
            echo "scan_passed=false" >> $GITHUB_OUTPUT
            echo "⚠️ Re-scan FAILED — còn ${CHECKOV_FAILS} lỗi"
          fi

  # ═══════════════════════════════════════════════════════════════
  # JOB 4 — Merge vào main
  #
  # FIX: Thêm triage-and-remediate vào needs để job không bị bỏ
  # qua khi verify-fixes bị skip (scan pass ngay từ đầu).
  #
  # Logic:
  #   Scan ban đầu PASS  → merge thẳng generated/*id vào main
  #   Scan fail + fix OK → merge fixed/*id vào main
  # ═══════════════════════════════════════════════════════════════
  merge-to-main:
    name: Merge Validated IaC to main
    runs-on: self-hosted
    needs:
      - pre-deployment-scan
      - triage-and-remediate
      - verify-fixes
    # FIX: Dùng needs.<job>.result để xử lý đúng cả khi job bị skip
    if: |
      always() &&
      !failure() &&
      (
        needs.pre-deployment-scan.outputs.scan_passed == 'true' ||
        (
          needs.verify-fixes.result == 'success' &&
          needs.verify-fixes.outputs.rescan_passed == 'true'
        )
      )
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine source branch to merge
        id: source
        run: |
          SCAN_PASSED="${{ needs.pre-deployment-scan.outputs.scan_passed }}"
          BRANCH_ID="${{ needs.pre-deployment-scan.outputs.branch_id }}"

          if [ "$SCAN_PASSED" = "true" ]; then
            SOURCE_BRANCH="generated/${BRANCH_ID}"
            echo "→ Scan pass ngay, merge generated/${BRANCH_ID}"
          else
            SOURCE_BRANCH="fixed/${BRANCH_ID}"
            echo "→ Đã fix, merge fixed/${BRANCH_ID}"
          fi

          echo "source_branch=${SOURCE_BRANCH}" >> $GITHUB_OUTPUT

      - name: Merge into main
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          SOURCE="${{ steps.source.outputs.source_branch }}"
          BRANCH_ID="${{ needs.pre-deployment-scan.outputs.branch_id }}"

          git fetch origin
          git checkout main
          git pull origin main

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git merge --no-ff "origin/${SOURCE}" -m "feat(iac): validated IaC for ${BRANCH_ID} | src=${SOURCE} run=${RUN_URL} [skip ci]"

          git push origin main
          echo "✅ Merged ${SOURCE} → main"

      - name: Notify Slack — merge success
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          BRANCH_ID="${{ needs.pre-deployment-scan.outputs.branch_id }}"
          curl -s -X POST "$SLACK_WEBHOOK" \
            -H "Content-type: application/json" \
            -d "{\"text\": \":merged: IaC \`${BRANCH_ID}\` đã validate xong và merge vào \`main\` — sẵn sàng deploy\"}" \
            || true

      - name: Cleanup temporary branches
        run: |
          BRANCH_ID="${{ needs.pre-deployment-scan.outputs.branch_id }}"
          git push origin --delete "generated/${BRANCH_ID}" || true
          git push origin --delete "fixed/${BRANCH_ID}"     || true
          echo "Đã xóa nhánh tạm: generated/${BRANCH_ID}, fixed/${BRANCH_ID}"


  # ═══════════════════════════════════════════════════════════════
  # JOB 5 — Terraform Apply AWS sau khi merge vào main
  # Giữ nguyên flow cũ: scan → triage → verify → merge.
  # Job này chỉ chạy SAU KHI merge-to-main success.
  # ═══════════════════════════════════════════════════════════════
  terraform-apply-aws:
    name: Terraform Apply AWS
    runs-on: self-hosted
    needs:
      - merge-to-main
    if: needs.merge-to-main.result == 'success'
    timeout-minutes: 20

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

      OPENSTACK_IP: ${{ secrets.OPENSTACK_IP }}
      TAILSCALE_AIO_IP: ${{ secrets.OPENSTACK_IP }}
      RUNNER_CLIENT_ID: "aegis-infra-runner"
      RUNNER_CLIENT_SECRET: ${{ secrets.RUNNER_CLIENT_SECRET }}

      AWS_REGION: "ap-southeast-1"
      TERRAFORM_AWS_DIR: "aws"
      TF_STATE_PATH: "/home/scan/scanners/tfstate/aws/terraform.tfstate"

    steps:
      - name: Checkout main after merge
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Install required tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl
          terraform version
          aws --version || true

      - name: Get AWS credentials from AegisZero STS
        run: |
          if [ -z "$RUNNER_CLIENT_SECRET" ]; then
            echo "❌ RUNNER_CLIENT_SECRET is empty. Check GitHub Repository Secrets."
            exit 1
          fi

          if [ ! -f "scripts/get_aws_credentials_ci.sh" ]; then
            echo "❌ scripts/get_aws_credentials_ci.sh not found."
            exit 1
          fi

          chmod +x scripts/get_aws_credentials_ci.sh
          scripts/get_aws_credentials_ci.sh

      - name: Check AWS identity
        run: |
          aws sts get-caller-identity

      - name: Check Terraform AWS directory
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "Terraform AWS dir: $GITHUB_WORKSPACE/$TERRAFORM_AWS_DIR"

          find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -name "*.tf" -print

          if [ ! -d "$GITHUB_WORKSPACE/$TERRAFORM_AWS_DIR" ]; then
            echo "❌ Terraform AWS directory not found: $GITHUB_WORKSPACE/$TERRAFORM_AWS_DIR"
            exit 1
          fi

      - name: Terraform init
        working-directory: ${{ github.workspace }}/${{ env.TERRAFORM_AWS_DIR }}
        run: |
          mkdir -p "$(dirname "$TF_STATE_PATH")"

          terraform init \
            -backend-config="path=${TF_STATE_PATH}"

      - name: Terraform validate
        working-directory: ${{ github.workspace }}/${{ env.TERRAFORM_AWS_DIR }}
        run: |
          terraform fmt -check || true
          terraform validate

      - name: Terraform plan
        working-directory: ${{ github.workspace }}/${{ env.TERRAFORM_AWS_DIR }}
        run: |
          terraform plan \
            -input=false \
            -out=tfplan

      - name: Terraform apply
        working-directory: ${{ github.workspace }}/${{ env.TERRAFORM_AWS_DIR }}
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            tfplan

      - name: Cleanup sensitive env
        if: always()
        run: |
          unset AWS_ACCESS_KEY_ID || true
          unset AWS_SECRET_ACCESS_KEY || true
          unset AWS_SESSION_TOKEN || true
          unset RUNNER_CLIENT_SECRET || true
          echo "Sensitive env cleaned"

  # ═══════════════════════════════════════════════════════════════
  # JOB 6 — Báo lỗi khi pipeline bị block hoàn toàn
  # ═══════════════════════════════════════════════════════════════
  report-failure:
    name: Report Pipeline Failure
    runs-on: self-hosted
    needs:
      - pre-deployment-scan
      - triage-and-remediate
      - verify-fixes
    if: |
      always() &&
      needs.pre-deployment-scan.outputs.scan_passed == 'false' &&
      (
        needs.verify-fixes.result == 'failure' ||
        needs.verify-fixes.result == 'skipped' ||
        needs.verify-fixes.outputs.rescan_passed == 'false'
      )
    steps:
      - name: Notify Slack — pipeline blocked
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          BRANCH_ID="${{ needs.pre-deployment-scan.outputs.branch_id }}"
          curl -s -X POST "$SLACK_WEBHOOK" \
            -H "Content-type: application/json" \
