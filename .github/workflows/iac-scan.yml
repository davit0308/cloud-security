name: IaC Security Scan Pipeline

on:
  push:
    branches:
      - "generated/**"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run remediation in dry-run mode?"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

      deploy_after_merge:
        description: "Deploy AWS after successful merge?"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

env:
  REPORTS_DIR: /home/scan/scanners/reports-ga
  ELK_IP: 100.116.107.97
  SCANNER_IP: 100.112.127.63
  OPENSTACK_IP: 100.113.72.113

  # AWS deploy
  TERRAFORM_AWS_DIR: aws
  TF_STATE_PATH: /home/scan/scanners/tfstate/aws/terraform.tfstate

  # AegisZero token exchange
  TAILSCALE_AIO_IP: 100.113.72.113
  RUNNER_CLIENT_ID: aegis-infra-runner

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  pre-deployment-scan:
    name: Pre-deployment IaC Scan
    runs-on: self-hosted

    outputs:
      scan_passed: ${{ steps.result.outputs.scan_passed }}
      checkov_fails: ${{ steps.result.outputs.checkov_fails }}
      trivy_fails: ${{ steps.result.outputs.trivy_fails }}
      branch_id: ${{ steps.branch.outputs.branch_id }}
      fixed_branch: ${{ steps.branch.outputs.fixed_branch }}

    steps:
      - name: Checkout generated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Resolve branch metadata
        id: branch
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}"
          BRANCH_ID="${BRANCH_NAME#generated/}"
          FIXED_BRANCH="fixed/${BRANCH_ID}"

          echo "Branch name: ${BRANCH_NAME}"
          echo "Branch ID: ${BRANCH_ID}"
          echo "Fixed branch: ${FIXED_BRANCH}"

          echo "branch_id=${BRANCH_ID}" >> "$GITHUB_OUTPUT"
          echo "fixed_branch=${FIXED_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Prepare report directories
        run: |
          mkdir -p "$REPORTS_DIR/checkov"
          mkdir -p "$REPORTS_DIR/trivy"
          mkdir -p "$REPORTS_DIR/meta"

      - name: Debug Terraform files
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "Terraform files being scanned:"
          find "$GITHUB_WORKSPACE" -type f -name "*.tf" -print

      - name: Run Checkov
        id: checkov
        continue-on-error: true
        run: |
          CHECKOV_JSON="$REPORTS_DIR/checkov/checkov-${{ steps.branch.outputs.branch_id }}.json"

          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/target" \
            bridgecrew/checkov:latest \
            -d /target \
            --output json \
            --output-file-path /target/checkov-result.json || true

          if [ -f "${GITHUB_WORKSPACE}/checkov-result.json" ]; then
            cp "${GITHUB_WORKSPACE}/checkov-result.json" "$CHECKOV_JSON"
          else
            echo '{"results": {"failed_checks": []}}' > "$CHECKOV_JSON"
          fi

          CHECKOV_FAILS=$(jq '[.. | objects | select(has("check_id"))] | length' "$CHECKOV_JSON" 2>/dev/null || echo 0)

          echo "Checkov fails: $CHECKOV_FAILS"
          echo "checkov_fails=$CHECKOV_FAILS" >> "$GITHUB_OUTPUT"

      - name: Run Trivy config scan
        id: trivy
        continue-on-error: true
        run: |
          TRIVY_JSON="$REPORTS_DIR/trivy/trivy-${{ steps.branch.outputs.branch_id }}.json"

          trivy config \
            --format json \
            --output "$TRIVY_JSON" \
            "$GITHUB_WORKSPACE" || true

          if [ ! -f "$TRIVY_JSON" ]; then
            echo '{"Results":[]}' > "$TRIVY_JSON"
          fi

          TRIVY_FAILS=$(jq '[.Results[]?.Misconfigurations[]?] | length' "$TRIVY_JSON" 2>/dev/null || echo 0)

          echo "Trivy fails: $TRIVY_FAILS"
          echo "trivy_fails=$TRIVY_FAILS" >> "$GITHUB_OUTPUT"

      - name: Send scan reports to ELK
        continue-on-error: true
        env:
          ELK_USER: ${{ secrets.ELK_USER }}
          ELK_SSH_KEY: ${{ secrets.ELK_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$ELK_SSH_KEY" > ~/.ssh/id_ed25519_elk
          chmod 600 ~/.ssh/id_ed25519_elk
          ssh-keyscan -H "$ELK_IP" >> ~/.ssh/known_hosts 2>/dev/null

          BRANCH_ID="${{ steps.branch.outputs.branch_id }}"

          ssh -i ~/.ssh/id_ed25519_elk \
            -o StrictHostKeyChecking=no \
            "${ELK_USER}@${ELK_IP}" \
            "mkdir -p ~/elk-stack/pipeline/incoming/checkov ~/elk-stack/pipeline/incoming/trivy"

          scp -i ~/.ssh/id_ed25519_elk \
            -o StrictHostKeyChecking=no \
            "$REPORTS_DIR/checkov/checkov-${BRANCH_ID}.json" \
            "${ELK_USER}@${ELK_IP}:~/elk-stack/pipeline/incoming/checkov/checkov-${BRANCH_ID}.json"

          scp -i ~/.ssh/id_ed25519_elk \
            -o StrictHostKeyChecking=no \
            "$REPORTS_DIR/trivy/trivy-${BRANCH_ID}.json" \
            "${ELK_USER}@${ELK_IP}:~/elk-stack/pipeline/incoming/trivy/trivy-${BRANCH_ID}.json"

          ssh -i ~/.ssh/id_ed25519_elk \
            -o StrictHostKeyChecking=no \
            "${ELK_USER}@${ELK_IP}" \
            "cd ~/elk-stack/pipeline \
             && source .env \
             && export BRANCH_ID=${BRANCH_ID} \
             && export CHECKOV_REPORT=~/elk-stack/pipeline/incoming/checkov/checkov-${BRANCH_ID}.json \
             && export TRIVY_REPORT=~/elk-stack/pipeline/incoming/trivy/trivy-${BRANCH_ID}.json \
             && {
                  python3 -m normalizer.checkov_to_rabbitmq || true;
                  python3 -m normalizer.trivy_to_rabbitmq || true;
                }"

      - name: Decide scan result
        id: result
        run: |
          CHECKOV_FAILS="${{ steps.checkov.outputs.checkov_fails }}"
          TRIVY_FAILS="${{ steps.trivy.outputs.trivy_fails }}"

          CHECKOV_FAILS="${CHECKOV_FAILS:-0}"
          TRIVY_FAILS="${TRIVY_FAILS:-0}"

          echo "checkov_fails=$CHECKOV_FAILS" >> "$GITHUB_OUTPUT"
          echo "trivy_fails=$TRIVY_FAILS" >> "$GITHUB_OUTPUT"

          if [ "$CHECKOV_FAILS" -eq 0 ] && [ "$TRIVY_FAILS" -eq 0 ]; then
            echo "scan_passed=true" >> "$GITHUB_OUTPUT"
            echo "✅ Scan passed"
          else
            echo "scan_passed=false" >> "$GITHUB_OUTPUT"
            echo "❌ Scan failed: Checkov=$CHECKOV_FAILS, Trivy=$TRIVY_FAILS"
          fi

  triage-and-remediate:
    name: Triage & Remediation
    runs-on: self-hosted

    needs:
      - pre-deployment-scan

    if: needs.pre-deployment-scan.outputs.scan_passed == 'false'

    outputs:
      has_fixes: ${{ steps.check-fixed.outputs.has_fixes }}
      fixed_branch: ${{ steps.check-fixed.outputs.fixed_branch }}

    steps:
      - name: Checkout generated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Prepare SSH to ELK
        env:
          ELK_SSH_KEY: ${{ secrets.ELK_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$ELK_SSH_KEY" > ~/.ssh/id_ed25519_elk
          chmod 600 ~/.ssh/id_ed25519_elk
          ssh-keyscan -H "$ELK_IP" >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH key ready — target: $ELK_IP"

      - name: Run triage on ELK VM
        env:
          ELK_USER: ${{ secrets.ELK_USER }}
        run: |
          DRY_RUN_VALUE="${{ github.event.inputs.dry_run || 'false' }}"
          BRANCH_ID_VALUE="${{ needs.pre-deployment-scan.outputs.branch_id }}"

          echo "=== KÍCH HOẠT TRIAGE TRÊN ELK VM (${ELK_IP}) ==="
          echo "DRY_RUN mode: ${DRY_RUN_VALUE}"
          echo "BRANCH_ID: ${BRANCH_ID_VALUE}"
          echo "Chờ 10 giây để Logstash đẩy dữ liệu vào Elasticsearch..."
          sleep 10

          ssh -i ~/.ssh/id_ed25519_elk \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            "${ELK_USER}@${ELK_IP}" \
            "cd ~/elk-stack/pipeline \
             && source .env \
             && export DRY_RUN=${DRY_RUN_VALUE} \
             && export BRANCH_ID=${BRANCH_ID_VALUE} \
             && timeout 300 python3 run_awsgoat_triage.py"

          echo "Triage hoàn thành"

      - name: Check fixed branch created by dispatcher
        id: check-fixed
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          BRANCH_ID="${{ needs.pre-deployment-scan.outputs.branch_id }}"
          FIXED_BRANCH="fixed/${BRANCH_ID}"

          echo "=== KIỂM TRA NHÁNH ${FIXED_BRANCH} ==="

          git fetch origin 2>/dev/null || true

          if git ls-remote --exit-code --heads origin "${FIXED_BRANCH}" > /dev/null 2>&1; then
            echo "✅ Dispatcher đã tạo ${FIXED_BRANCH} — có fix thực sự"
            echo "has_fixes=true" >> "$GITHUB_OUTPUT"

            COMMIT_MSG=$(git log "origin/${FIXED_BRANCH}" -1 --format="%s" 2>/dev/null || echo "")
            echo "Commit message: ${COMMIT_MSG}"

            if echo "$COMMIT_MSG" | grep -qi "placeholder"; then
              echo "⚠️ Branch là placeholder — không có fix thực sự"
              echo "has_fixes=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "ℹ️ Dispatcher chưa tạo ${FIXED_BRANCH} — không có fix tự động"
            echo "has_fixes=false" >> "$GITHUB_OUTPUT"
          fi

          echo "fixed_branch=${FIXED_BRANCH}" >> "$GITHUB_OUTPUT"

  verify-fixes:
    name: Verify Fixes
    runs-on: self-hosted

    needs:
      - pre-deployment-scan
      - triage-and-remediate

    if: needs.triage-and-remediate.outputs.has_fixes == 'true'

    outputs:
      rescan_passed: ${{ steps.verify-result.outputs.rescan_passed }}
      checkov_fails_after: ${{ steps.verify-result.outputs.checkov_fails_after }}
      trivy_fails_after: ${{ steps.verify-result.outputs.trivy_fails_after }}

    steps:
      - name: Checkout fixed branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.triage-and-remediate.outputs.fixed_branch }}
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Debug Terraform files after fix
        run: |
          echo "Fixed branch: ${{ needs.triage-and-remediate.outputs.fixed_branch }}"
          find "$GITHUB_WORKSPACE" -type f -name "*.tf" -print

      - name: Re-run Checkov on fixed branch
        id: checkov-fixed
        continue-on-error: true
        run: |
          mkdir -p "$REPORTS_DIR/checkov"

          CHECKOV_FIXED_JSON="$REPORTS_DIR/checkov/checkov-fixed-${{ needs.pre-deployment-scan.outputs.branch_id }}.json"

          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/target" \
            bridgecrew/checkov:latest \
            -d /target \
            --output json \
            --output-file-path /target/checkov-fixed-result.json || true

          if [ -f "${GITHUB_WORKSPACE}/checkov-fixed-result.json" ]; then
            cp "${GITHUB_WORKSPACE}/checkov-fixed-result.json" "$CHECKOV_FIXED_JSON"
          else
            echo '{"results": {"failed_checks": []}}' > "$CHECKOV_FIXED_JSON"
          fi

          CHECKOV_FAILS_AFTER=$(jq '[.. | objects | select(has("check_id"))] | length' "$CHECKOV_FIXED_JSON" 2>/dev/null || echo 0)

          echo "Checkov fails after fix: $CHECKOV_FAILS_AFTER"
          echo "checkov_fails_after=$CHECKOV_FAILS_AFTER" >> "$GITHUB_OUTPUT"

      - name: Re-run Trivy on fixed branch
        id: trivy-fixed
        continue-on-error: true
        run: |
          mkdir -p "$REPORTS_DIR/trivy"

          TRIVY_FIXED_JSON="$REPORTS_DIR/trivy/trivy-fixed-${{ needs.pre-deployment-scan.outputs.branch_id }}.json"

          trivy config \
            --format json \
            --output "$TRIVY_FIXED_JSON" \
            "$GITHUB_WORKSPACE" || true

          TRIVY_FAILS_AFTER=$(jq '[.Results[]?.Misconfigurations[]?] | length' "$TRIVY_FIXED_JSON" 2>/dev/null || echo 0)

          echo "Trivy fails after fix: $TRIVY_FAILS_AFTER"
          echo "trivy_fails_after=$TRIVY_FAILS_AFTER" >> "$GITHUB_OUTPUT"

      - name: Decide verify result
        id: verify-result
        run: |
          CHECKOV_FAILS_AFTER="${{ steps.checkov-fixed.outputs.checkov_fails_after }}"
          TRIVY_FAILS_AFTER="${{ steps.trivy-fixed.outputs.trivy_fails_after }}"

          CHECKOV_FAILS_AFTER="${CHECKOV_FAILS_AFTER:-0}"
          TRIVY_FAILS_AFTER="${TRIVY_FAILS_AFTER:-0}"

          echo "checkov_fails_after=$CHECKOV_FAILS_AFTER" >> "$GITHUB_OUTPUT"
          echo "trivy_fails_after=$TRIVY_FAILS_AFTER" >> "$GITHUB_OUTPUT"

          if [ "$CHECKOV_FAILS_AFTER" -eq 0 ] && [ "$TRIVY_FAILS_AFTER" -eq 0 ]; then
            echo "rescan_passed=true" >> "$GITHUB_OUTPUT"
            echo "✅ Verify passed"
          else
            echo "rescan_passed=false" >> "$GITHUB_OUTPUT"
            echo "❌ Verify failed: Checkov=$CHECKOV_FAILS_AFTER, Trivy=$TRIVY_FAILS_AFTER"
          fi

  merge-to-main:
    name: Merge Validated IaC to main
    runs-on: self-hosted

    needs:
      - pre-deployment-scan
      - triage-and-remediate
      - verify-fixes

    if: |
      always() &&
      !failure() &&
      (
        needs.pre-deployment-scan.outputs.scan_passed == 'true' ||
        (
          needs.verify-fixes.result == 'success' &&
          needs.verify-fixes.outputs.rescan_passed == 'true'
        )
      )

    outputs:
      merged: ${{ steps.merge.outputs.merged }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Merge validated branch into main
        id: merge
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote set-url origin "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git"

          if [ "${{ needs.pre-deployment-scan.outputs.scan_passed }}" = "true" ]; then
            SOURCE_BRANCH="generated/${{ needs.pre-deployment-scan.outputs.branch_id }}"
          else
            SOURCE_BRANCH="${{ needs.triage-and-remediate.outputs.fixed_branch }}"
          fi

          echo "Source branch: $SOURCE_BRANCH"

          git fetch origin main "$SOURCE_BRANCH"

          git checkout main
          git pull origin main

          git merge --no-ff "origin/${SOURCE_BRANCH}" -m "merge(iac): validated IaC from ${SOURCE_BRANCH}"

          git push origin main

          echo "merged=true" >> "$GITHUB_OUTPUT"
          echo "✅ Merged ${SOURCE_BRANCH} into main"

  terraform-apply-aws:
    name: Terraform Apply AWS
    runs-on: self-hosted

    needs:
      - merge-to-main

    if: |
      always() &&
      needs.merge-to-main.result == 'success' &&
      (github.event.inputs.deploy_after_merge == 'true' || github.event_name == 'push')

    timeout-minutes: 20

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

      TAILSCALE_AIO_IP: "100.113.72.113"
      RUNNER_CLIENT_ID: "aegis-infra-runner"
      RUNNER_CLIENT_SECRET: ${{ secrets.RUNNER_CLIENT_SECRET }}

      TERRAFORM_AWS_DIR: "aws"
      TF_STATE_PATH: "/home/scan/scanners/tfstate/aws/terraform.tfstate"

    steps:
      - name: Checkout main after merge
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Install required tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl
          terraform version
          aws --version || true

      - name: Get AWS credentials from AegisZero STS
        run: |
          chmod +x scripts/get_aws_credentials_ci.sh
          scripts/get_aws_credentials_ci.sh

      - name: Check AWS identity
        run: |
          aws sts get-caller-identity

      - name: Check Terraform AWS directory
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "Terraform AWS dir: $GITHUB_WORKSPACE/$TERRAFORM_AWS_DIR"

          find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -name "*.tf" -print

          if [ ! -d "$GITHUB_WORKSPACE/$TERRAFORM_AWS_DIR" ]; then
            echo "❌ Terraform AWS directory not found: $GITHUB_WORKSPACE/$TERRAFORM_AWS_DIR"
            exit 1
          fi

      - name: Terraform init
        working-directory: ${{ github.workspace }}/${{ env.TERRAFORM_AWS_DIR }}
        run: |
          mkdir -p "$(dirname "$TF_STATE_PATH")"

          terraform init \
            -backend-config="path=${TF_STATE_PATH}"

      - name: Terraform validate
        working-directory: ${{ github.workspace }}/${{ env.TERRAFORM_AWS_DIR }}
        run: |
          terraform fmt -check || true
          terraform validate

      - name: Terraform plan
        working-directory: ${{ github.workspace }}/${{ env.TERRAFORM_AWS_DIR }}
        run: |
          terraform plan \
            -input=false \
            -out=tfplan

      - name: Terraform apply
        working-directory: ${{ github.workspace }}/${{ env.TERRAFORM_AWS_DIR }}
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            tfplan

      - name: Cleanup sensitive env
        if: always()
        run: |
          unset AWS_ACCESS_KEY_ID || true
          unset AWS_SECRET_ACCESS_KEY || true
          unset AWS_SESSION_TOKEN || true
          echo "Sensitive env cleaned"

  report-failure:
    name: Report Pipeline Failure
    runs-on: self-hosted

    needs:
      - pre-deployment-scan
      - triage-and-remediate
      - verify-fixes
      - merge-to-main
      - terraform-apply-aws

    if: |
      always() &&
      (
        needs.pre-deployment-scan.outputs.scan_passed == 'false' &&
        (
          needs.triage-and-remediate.outputs.has_fixes != 'true' ||
          needs.verify-fixes.outputs.rescan_passed != 'true'
        )
      )

    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          BRANCH_ID="${{ needs.pre-deployment-scan.outputs.branch_id }}"

          if [ -z "$SLACK_WEBHOOK" ]; then
            echo "SLACK_WEBHOOK is empty, skip notification"
            exit 0
          fi

          HTTP_CODE=$(curl -s -o /tmp/slack_resp.txt -w "%{http_code}" \
            -X POST "$SLACK_WEBHOOK" \
            -H "Content-type: application/json" \
            -d "{\"text\": \":rotating_light: IaC \`${BRANCH_ID}\` BỊ CHẶN — auto-fix chưa giải quyết hết lỗi hoặc verify fail. Cần review thủ công. <https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}|Xem chi tiết>\"}")

          echo "Slack HTTP code: $HTTP_CODE"
          echo "Slack response:"
          cat /tmp/slack_resp.txt
